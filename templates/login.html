<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理员登录 · 欧朋AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='7') }}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="logo">欧</div>
      <div><b>欧朋AI</b><small>多模型智能调度网关</small></div>
    </div>
    <h2>管理员登录</h2>
    {% if show_default_hint %}
    <p class="hint">首次启动密码为 <span class="kbd">{{ default_password }}</span>，登录后请在「系统设置」中修改。</p>
    {% else %}
    <p class="hint">请输入管理员密码。</p>
    {% endif %}
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入管理员密码" autofocus required>
      </div>
      <div class="login-err" id="login-err"></div>
      <button class="btn btn-primary" type="submit" id="login-btn">登录</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='js/app.js', v='7') }}"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('login-btn');
      var errEl = document.getElementById('login-err');
      errEl.textContent = '';
      btn.disabled = true;
      try {
        await api('/db_admin/api/login', {
          method: 'POST',
          body: { password: document.getElementById('password').value }
        });
        location.href = '/db_admin/dashboard';
      } catch (err) {
        errEl.textContent = err.message || '登录失败';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
